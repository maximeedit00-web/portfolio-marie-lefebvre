name: Build (validation)

# Le déploiement est assuré par Cloudflare Pages (connexion directe à GitHub).
# Ce workflow sert uniquement à vérifier que le site compile.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
