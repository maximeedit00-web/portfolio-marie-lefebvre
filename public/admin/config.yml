# Configuration de l'administration (Decap CMS)
# L'interface est disponible sur /admin
#
# EN LOCAL : lancez `npm run cms` puis `npm run dev`, et ouvrez http://localhost:4321/admin
# EN LIGNE : déployez sur Netlify, activez Identity + Git Gateway, puis invitez
# uniquement l'e-mail de la cliente. Elle pourra se connecter sur /admin.

backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/media"
public_folder: "/media"

collections:
  - name: settings
    label: "Réglages"
    files:
      - name: site
        label: "Infos & textes du site"
        file: "content/settings.json"
        fields:
          - { label: "Nom", name: "name", widget: "string" }
          - { label: "Nom court", name: "shortName", widget: "string" }
          - { label: "Métier", name: "role", widget: "string" }
          - { label: "Spécialité", name: "speciality", widget: "string" }
          - { label: "Accroche", name: "tagline", widget: "string" }
          - { label: "Description (référencement)", name: "description", widget: "text" }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Instagram (pseudo)", name: "instagram_handle", widget: "string" }
          - { label: "Instagram (lien)", name: "instagram_url", widget: "string" }
          - { label: "Discord (pseudo)", name: "discord_handle", widget: "string" }
          - { label: "Discord (lien)", name: "discord_url", widget: "string" }
          - { label: "Accueil — petit mot manuscrit", name: "hero_script", widget: "string" }
          - { label: "Accueil — grand titre", name: "hero_title", widget: "string" }
          - { label: "Accueil — texte d'intro", name: "hero_intro", widget: "text" }
          - { label: "À propos — paragraphe 1", name: "about_p1", widget: "text" }
          - { label: "À propos — paragraphe 2", name: "about_p2", widget: "text" }
          - { label: "À propos — paragraphe 3", name: "about_p3", widget: "text" }

  - name: videos
    label: "Vidéos (Montage)"
    files:
      - name: projects
        label: "Projets"
        file: "content/projects.json"
        fields:
          - label: "Liste des vidéos"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Lien (slug)", name: "slug", widget: "string", hint: "Sans espaces ni accents. Ex. : mon-super-montage" }
              - { label: "Créateur (laisser vide si c'est toi)", name: "channel", widget: "string", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Montage long", "Formats courts", "Vlog", "Motion design", "Trailer", "Créateurs", "Communication"]
              - { label: "Format", name: "format", widget: "select", options: ["16:9", "9:16"] }
              - { label: "Orientation", name: "orientation", widget: "select", options: ["horizontal", "vertical"] }
              - { label: "ID YouTube (ex. dQw4w9WgXcQ)", name: "videoId", widget: "string", required: false, hint: "Pour une vidéo YouTube (publiée ou non répertoriée)" }
              - { label: "Fichier vidéo (ex. /videos/mon-film.mp4)", name: "videoFile", widget: "string", required: false, hint: "Pour une vidéo hébergée sur le site (dossier public/videos)" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Miniature", name: "poster", widget: "image" }
              - { label: "Mettre en vedette (grand format)", name: "featured", widget: "boolean", default: false, required: false }

  - name: reviews
    label: "Avis"
    files:
      - name: reviews
        label: "Témoignages clients"
        file: "content/reviews.json"
        fields:
          - label: "Liste des avis"
            name: "items"
            widget: "list"
            summary: "{{fields.author}} — {{fields.rating}}/5"
            fields:
              - { label: "Nom", name: "author", widget: "string", required: false }
              - { label: "Contexte", name: "role", widget: "string", required: false }
              - { label: "Note (1 à 5)", name: "rating", widget: "number", min: 1, max: 5, default: 5 }
              - { label: "Texte", name: "text", widget: "text" }

  - name: graphics
    label: "Graphisme (miniatures & dessins)"
    files:
      - name: graphics
        label: "Miniatures & dessins"
        file: "content/graphics.json"
        fields:
          - label: "Éléments"
            name: "items"
            widget: "list"
            summary: "{{fields.kind}}"
            fields:
              - { label: "Type", name: "kind", widget: "select", options: ["Miniature", "Dessin"] }
              - { label: "Orientation", name: "orientation", widget: "select", options: ["landscape", "portrait"], default: "portrait" }
              - { label: "Titre (optionnel)", name: "title", widget: "string", required: false }
              - { label: "Légende (optionnel)", name: "description", widget: "string", required: false }
              - { label: "Image", name: "poster", widget: "image" }

  - name: affiches
    label: "Affiches (Comm)"
    files:
      - name: affiches
        label: "Affiches"
        file: "content/affiches.json"
        fields:
          - label: "Affiches"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre (optionnel)", name: "title", widget: "string", required: false }
              - { label: "Légende (optionnel)", name: "description", widget: "string", required: false }
              - { label: "Image", name: "poster", widget: "image" }
