# Configuration de l'administration (Decap CMS)
# Interface : /admin
#
# EN LOCAL : `npm run cms` puis `npm run dev`, ouvrir http://localhost:4321/admin et cliquer "Login".
# EN LIGNE : sur Netlify, activer Identity + Git Gateway, puis inviter uniquement l'e-mail de la cliente.

backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/media"
public_folder: "/media"

collections:
  - name: textes
    label: "1. Textes du site"
    files:
      - name: site
        label: "Textes (accueil, à propos, contacts)"
        file: "content/settings.json"
        fields:
          - { label: "Nom affiché", name: "name", widget: "string", hint: "Ex. Marie Lefebvre" }
          - { label: "Prénom court", name: "shortName", widget: "string" }
          - { label: "Métier", name: "role", widget: "string", hint: "Ex. Monteuse vidéo" }
          - { label: "Spécialités (séparées par ·)", name: "speciality", widget: "string" }
          - { label: "Accroche", name: "tagline", widget: "string" }
          - { label: "Description pour Google", name: "description", widget: "text" }
          - { label: "Image d'aperçu du lien (optionnel)", name: "og_image", widget: "image", required: false, hint: "Image affichée quand on partage le lien. Laisser vide pour ne PAS afficher d'image." }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Instagram (pseudo)", name: "instagram_handle", widget: "string" }
          - { label: "Instagram (lien complet)", name: "instagram_url", widget: "string" }
          - { label: "Discord (pseudo)", name: "discord_handle", widget: "string" }
          - { label: "Discord (lien)", name: "discord_url", widget: "string" }
          - { label: "Accueil — petit mot manuscrit", name: "hero_script", widget: "string" }
          - { label: "Accueil — grand titre", name: "hero_title", widget: "string" }
          - { label: "Accueil — paragraphe d'introduction", name: "hero_intro", widget: "text" }
          - { label: "À propos — paragraphe 1", name: "about_p1", widget: "text" }
          - { label: "À propos — paragraphe 2", name: "about_p2", widget: "text" }
          - { label: "À propos — paragraphe 3", name: "about_p3", widget: "text" }

  - name: videos
    label: "2. Vidéos"
    files:
      - name: projects
        label: "Mes vidéos"
        file: "content/projects.json"
        fields:
          - label: "Liste des vidéos"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Pour ajouter une vidéo : bouton en bas de liste. Remplis un ID YouTube OU un fichier vidéo. Glisse-dépose pour changer l'ordre."
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Identifiant du lien (sans espaces ni accents)", name: "slug", widget: "string", hint: "Ex. mon-super-montage" }
              - { label: "Créateur (laisser vide si c'est toi)", name: "channel", widget: "string", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Montage long", "Formats courts", "Vlog", "Motion design", "Trailer", "Créateurs", "Communication"]
              - { label: "Format", name: "format", widget: "select", options: ["16:9", "9:16"], hint: "16:9 = horizontal · 9:16 = vertical (short / reel)" }
              - { label: "Sens", name: "orientation", widget: "select", options: ["horizontal", "vertical"] }
              - { label: "ID YouTube", name: "videoId", widget: "string", required: false, hint: "La partie après « v= » dans le lien. Ex. dQw4w9WgXcQ" }
              - { label: "Fichier vidéo hébergé sur le site", name: "videoFile", widget: "string", required: false, hint: "Ex. /videos/mon-film.mp4 — laisse vide si tu utilises YouTube" }
              - { label: "Description courte", name: "description", widget: "text" }
              - { label: "Miniature", name: "poster", widget: "image", hint: "L'image affichée (16:9 ou 9:16)" }
              - { label: "Mettre en vedette (grand format sur l'accueil)", name: "featured", widget: "boolean", default: false, required: false }

  - name: miniatures
    label: "3. Miniatures"
    files:
      - name: miniatures
        label: "Mes miniatures"
        file: "content/miniatures.json"
        fields:
          - label: "Miniatures"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Supprime une miniature avec la corbeille, ou ajoute-en une en bas. Glisse-dépose pour changer l'ordre."
            fields:
              - { label: "Titre (optionnel)", name: "title", widget: "string", required: false }
              - { label: "Image", name: "poster", widget: "image" }

  - name: dessins
    label: "4. Dessins & illustrations"
    files:
      - name: dessins
        label: "Mes dessins"
        file: "content/dessins.json"
        fields:
          - label: "Dessins"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Glisse-dépose pour changer l'ordre."
            fields:
              - { label: "Titre (optionnel)", name: "title", widget: "string", required: false }
              - { label: "Image", name: "poster", widget: "image" }

  - name: affiches
    label: "5. Affiches"
    files:
      - name: affiches
        label: "Mes affiches"
        file: "content/affiches.json"
        fields:
          - label: "Affiches"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Glisse-dépose pour changer l'ordre."
            fields:
              - { label: "Titre (optionnel)", name: "title", widget: "string", required: false }
              - { label: "Légende (optionnel)", name: "description", widget: "string", required: false }
              - { label: "Image", name: "poster", widget: "image" }

  - name: avis
    label: "6. Avis"
    files:
      - name: reviews
        label: "Témoignages"
        file: "content/reviews.json"
        fields:
          - label: "Avis"
            name: "items"
            widget: "list"
            summary: "{{fields.author}}"
            hint: "Glisse-dépose un avis pour changer son ordre."
            fields:
              - { label: "Nom", name: "author", widget: "string", required: false }
              - { label: "Lien de la chaîne / du profil (optionnel)", name: "url", widget: "string", required: false, hint: "Ex. https://youtube.com/@... — le nom de la personne deviendra cliquable" }
              - { label: "Contexte", name: "role", widget: "string", required: false }
              - { label: "Note (1 à 5)", name: "rating", widget: "number", min: 1, max: 5, default: 5 }
              - { label: "Texte", name: "text", widget: "text" }

  - name: clients
    label: "7. Ils m'ont fait confiance"
    files:
      - name: clients
        label: "Chaînes"
        file: "content/clients.json"
        fields:
          - label: "Chaînes"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "Les logos/chaînes affichés en grand sur le site. Glisse-dépose pour changer l'ordre."
            fields:
              - { label: "Nom de la chaîne", name: "name", widget: "string", required: false }
              - { label: "Logo / photo de profil", name: "logo", widget: "image" }
              - { label: "Lien de la chaîne", name: "url", widget: "string", required: false, hint: "Ex. https://youtube.com/@..." }

  - name: pages
    label: "8. Pages du site"
    files:
      - name: pages
        label: "Textes de chaque page"
        file: "content/pages.json"
        fields:
          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Petit mot (manuscrit)", name: "hero_script", widget: "string" }
              - { label: "Titre", name: "hero_title", widget: "string" }
              - { label: "Description", name: "hero_desc", widget: "text" }
              - { label: "Tarifs — titre", name: "pricing_title", widget: "string" }
              - { label: "Tarifs — texte", name: "pricing_note", widget: "text" }
              - { label: "Process — titre", name: "process_title", widget: "string" }
              - { label: "Process — texte", name: "process_text", widget: "text" }
              - { label: "Bouton final", name: "cta_title", widget: "string" }
          - label: "Graphisme"
            name: "graphisme"
            widget: "object"
            fields:
              - { label: "Petit mot (manuscrit)", name: "hero_script", widget: "string" }
              - { label: "Titre", name: "hero_title", widget: "string" }
              - { label: "Description", name: "hero_desc", widget: "text" }
              - { label: "Section Miniatures — titre", name: "mini_title", widget: "string" }
              - { label: "Section Miniatures — sous-titre", name: "mini_sub", widget: "string" }
              - { label: "Section Dessins — titre", name: "dessin_title", widget: "string" }
              - { label: "Section Dessins — sous-titre", name: "dessin_sub", widget: "string" }
              - { label: "Bouton final", name: "cta_title", widget: "string" }
          - label: "Comm"
            name: "comm"
            widget: "object"
            fields:
              - { label: "Petit mot (manuscrit)", name: "hero_script", widget: "string" }
              - { label: "Titre", name: "hero_title", widget: "string" }
              - { label: "Description", name: "hero_desc", widget: "text" }
              - { label: "Titre page affiches", name: "affiches_title", widget: "string" }
              - { label: "Titre stages", name: "stages_title", widget: "string" }
              - { label: "Texte stages", name: "stages_text", widget: "text" }
              - { label: "Bouton final", name: "cta_title", widget: "string" }
          - label: "Avis"
            name: "avis"
            widget: "object"
            fields:
              - { label: "Petit mot (manuscrit)", name: "hero_script", widget: "string" }
              - { label: "Titre", name: "hero_title", widget: "string" }
              - { label: "Description", name: "hero_desc", widget: "text" }
              - { label: "Bouton final", name: "cta_title", widget: "string" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Petit mot (manuscrit)", name: "hero_script", widget: "string" }
              - { label: "Titre", name: "hero_title", widget: "string" }
              - { label: "Description", name: "hero_desc", widget: "text" }
              - { label: "Encart « Ce dont j'ai besoin » — titre", name: "needs_title", widget: "string" }
              - { label: "Encart — texte", name: "needs_text", widget: "text" }
          - label: "À propos"
            name: "about"
            widget: "object"
            fields:
              - { label: "Petit mot (manuscrit)", name: "hero_script", widget: "string" }
              - { label: "Titre", name: "hero_title", widget: "string" }
              - { label: "Description", name: "hero_desc", widget: "text" }
              - { label: "Process — titre", name: "process_title", widget: "string" }
          - label: "Mentions légales"
            name: "mentions"
            widget: "object"
            fields:
              - label: "Sections"
                name: "sections"
                widget: "list"
                summary: "{{fields.titre}}"
                hint: "Une ligne = un paragraphe."
                fields:
                  - { label: "Titre", name: "titre", widget: "string" }
                  - { label: "Texte", name: "texte", widget: "text" }
          - label: "Politique de confidentialité"
            name: "confidentialite"
            widget: "object"
            fields:
              - label: "Sections"
                name: "sections"
                widget: "list"
                summary: "{{fields.titre}}"
                hint: "Une ligne = un paragraphe."
                fields:
                  - { label: "Titre", name: "titre", widget: "string" }
                  - { label: "Texte", name: "texte", widget: "text" }

  - name: navigation
    label: "9. Navigation (onglets du menu)"
    files:
      - name: navigation
        label: "Menu du site"
        file: "content/navigation.json"
        fields:
          - label: "Onglets"
            name: "items"
            widget: "list"
            summary: "{{fields.label}} → {{fields.href}}"
            hint: "Ajoute un onglet, ou glisse-dépose pour changer l'ordre."
            fields:
              - { label: "Nom de l'onglet", name: "label", widget: "string" }
              - { label: "Lien", name: "href", widget: "string", hint: "Vers une page existante (ex. /contact) ou une page créée en 10 (ex. /ma-page)" }

  - name: custompages
    label: "10. Pages personnalisées"
    files:
      - name: custompages
        label: "Mes pages"
        file: "content/custom-pages.json"
        fields:
          - label: "Pages"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Crée une page, puis ajoute son lien (ex. /ma-page) dans la section 9 pour l'afficher dans le menu."
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Lien (slug, sans espaces ni accents)", name: "slug", widget: "string", hint: "Ex. mon-projet → la page sera /mon-projet" }
              - { label: "Sous-titre au-dessus du titre (optionnel)", name: "eyebrow", widget: "string", required: false }
              - { label: "Petit mot manuscrit (optionnel)", name: "script", widget: "string", required: false }
              - { label: "Description (optionnel)", name: "description", widget: "text", required: false }
              - label: "Blocs de contenu"
                name: "blocks"
                widget: "list"
                summary: "{{fields.type}}"
                hint: "Ajoute des blocs : du texte, ou une galerie d'images."
                fields:
                  - { label: "Type de bloc", name: "type", widget: "select", options: ["texte", "galerie"] }
                  - { label: "Titre (optionnel)", name: "titre", widget: "string", required: false }
                  - { label: "Texte (si type = texte)", name: "texte", widget: "text", required: false }
                  - label: "Images (si type = galerie)"
                    name: "images"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Légende (optionnel)", name: "legende", widget: "string", required: false }
